<html>
    <body>
        <script>
            let obj=
            {
                name:"abc",
                age:18,
                present:true
            }
            console.log(obj.name,obj.age,obj.present)
            console.log(obj)

            <!--for array-->
            let obj1=
            {
                employees:["abc","pqr","xyz"],
                
            }
            console.log(obj1.employees)
            console.log(obj1.employees[2])

            // for nested object
            
            let obj2={employees:{name:"abc",age:19}}
            console.log(obj2.employees.age)
        </script>
    </body>
</html>
