<!--write function first and last thet taks in an array & returns an object with the first element of array as 
objects key and last ele of array as thet keys value-->
<html>
    <script>
        function firstandlast(array)
        {
            let obj={}
            obj[array[0]]=array[array.length-1]
            return obj
        }
        let arr1=["abc","pqr","xyz","def"]
        console.log(firstandlast(arr1))
    </script>
</html>
