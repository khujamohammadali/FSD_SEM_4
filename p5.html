<html>
  <body>
    <h1 id="msg"></h1>
    <script>
      const obj = {
        "A": "LJU",
        "B": ["CSE", "IT", "CE"],
        "C": [
          {
            "D": "Hi",
            "E": ["are", 4, { "F": ["semester", "We"] }]
          }
        ],
        "G": {
          "H": "students",
          "I": ["of", "!"]
        },
        "J": [{ "K": "Python", "L": "branch" }, "FSD-2"]
      };

      // Construct sentence
      const sentence =
        obj.C[0].D + obj.G.I[1] + " " + // "Hi!"
        obj.C[0].E[2].F[1] + " " +       // "We"
        obj.C[0].E[0] + " " +            // "are"
        obj.G.H + " " +                  // "students"
        obj.G.I[0] + " " +               // "of"
        obj.C[0].E[2].F[0] + " " +       // "semester"
        obj.C[0].E[1] + " " +            // "4"
        obj.G.I[0] + " " +               // "of"
        obj.B[0] + " " +                 // "CSE"
        obj.J[0].L;                      // "branch"

      document.getElementById("msg").innerText = sentence;
    </script>
  </body>
</html>
